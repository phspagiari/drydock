# Repo tooling config only. drydock is cloned and run, never installed as a
# package, and board/ is standard library only — there are no dependencies to
# declare and nothing to build.

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

# `ruff format` is deliberately NOT part of CI. board/ is hand-formatted for
# reading — compact literals, aligned regex continuations, aligned parameter
# lists in the path-traversal tests — and the formatter's output is longer and
# harder to read in several of those places. `ruff check` is the gate; keep new
# code consistent with what is already there.
