name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.5
          args: check plugin/board/

  test:
    name: board tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The documented floor, so README's "Python 3.10+" is a tested claim
      # rather than an assertion. Newer versions are covered by developers
      # running the suite locally.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: unittest
        run: python3 -m unittest discover plugin/board/tests --verbose

  docs:
    name: markdown + workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned: markdownlint ships new rules in minor releases, and a new rule
      # landing on a Tuesday should not fail an unrelated pull request.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
